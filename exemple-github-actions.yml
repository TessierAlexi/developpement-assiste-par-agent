# EXEMPLE SEULEMENT : GitHub Actions ne lit que .github/workflows/, donc ce fichier ne roule pas.
# Pour l'activer : copie-le dans .github/workflows/ci.yml.
#
# Ce sont les garde-fous de la diapositive « Des garde-fous avant même la revue » et l'étape 7 de
# « La boucle complète » : les mêmes vérifications que l'agent roule localement, refaites à chaque PR,
# plus les tests sur la version PHP actuelle ET la prochaine. Quand une étape échoue, l'agent lit
# l'erreur (gh run view --log-failed) et corrige, comme pour un test rouge.
#
# Prérequis : le projet de départ a Pint et Pest, mais pas Larastan ni Rector. Ajoute-les d'abord :
#   ./vendor/bin/sail composer require --dev larastan/larastan phpstan/phpstan-deprecation-rules \
#       rector/rector driftingly/rector-laravel
#
# phpstan.neon :
#   includes:
#       - vendor/larastan/larastan/extension.neon
#       - vendor/phpstan/phpstan-deprecation-rules/rules.neon
#   parameters:
#       paths: [app, database, routes]
#       level: 5            # sur du code existant : commence bas, avec une baseline
#                           # (vendor/bin/phpstan --generate-baseline), puis monte graduellement
#
# rector.php (les règles du PHP visé et de la version de Laravel installée ; le diff de --dry-run
# est la liste de ce qui va casser ou devenir déprécié) :
#   <?php
#   use Rector\Config\RectorConfig;
#   use RectorLaravel\Set\LaravelSetProvider;
#   return RectorConfig::configure()
#       ->withPaths([__DIR__.'/app', __DIR__.'/database', __DIR__.'/routes', __DIR__.'/tests'])
#       ->withPhpSets()
#       ->withSetProviders(LaravelSetProvider::class)
#       ->withComposerBased(laravel: true);
#
# Et dans composer.json, un seul script que l'agent roule avant de dire « fini » (CLAUDE.md : « roule
# `composer check` avant de dire que c'est fini ») :
#   "check": ["pint --test", "phpstan analyse --no-progress", "rector --dry-run", "@php artisan test"]

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Pint, Larastan, Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Style (Pint)
        run: vendor/bin/pint --test
      - name: Analyse statique et dépréciations (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --error-format=github
      - name: Dépréciations à venir (Rector, sans rien modifier)
        run: vendor/bin/rector process --dry-run --no-progress-bar

  tests:
    name: Pest sur PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    # La version PHP de demain informe sans bloquer : un échec sur nightly est un avertissement.
    continue-on-error: ${{ matrix.php == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', 'nightly']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test --compact

  frontend:
    name: Vitest et build sur Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.node == 'current' }}
    strategy:
      fail-fast: false
      matrix:
        node: ['lts/*', 'current']
    env:
      # Une API Node dépréciée fait échouer le job au lieu d'afficher un avertissement qu'on ne lit pas.
      NODE_OPTIONS: --throw-deprecation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx vitest run --passWithNoTests
      - run: npm run build

  securite:
    name: Dépendances vulnérables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer audit --locked
      - run: npm audit --audit-level=high
